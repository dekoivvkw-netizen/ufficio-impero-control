<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0c">
<title>UFFICIO IMPERO</title>
<style>
:root { --bg:#0a0a0c; --card:#121214; --border:#222226; --gold:#d4af37; --text:#e8e6e3; --muted:#888; --green:#3dd68c; --red:#ff5c5c; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,sans-serif; padding:env(safe-area-inset-top) 12px 20px; }
.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.badge { background:#1a1a1e; border:1px solid var(--border); border-radius:20px; padding:4px 10px; font-size:11px; color:var(--gold); }
h1 { font-size:20px; font-weight:700; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; }
.metric-big { font-size:22px; font-weight:700; }
.metric-label { font-size:11px; color:var(--muted); margin-top:2px; }
.agents { display:flex; gap:6px; overflow-x:auto; padding:8px 0; margin-bottom:10px; }
.agent { flex:0 0 auto; background:#1a1a1e; border:1px solid var(--border); border-radius:12px; padding:8px 12px; font-size:12px; text-align:center; min-width:70px; }
.agent span { display:block; font-size:16px; margin-bottom:2px; }
.btn { width:100%; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:600; margin:6px 0; }
.btn-gold { background:var(--gold); color:#0a0a0c; }
.btn-dark { background:#1e1e22; color:var(--text); border:1px solid var(--border); }
.btn-red { background:var(--red); color:#fff; }
input, select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:#1a1a1e; color:var(--text); margin:4px 0; font-size:15px; }
.login { max-width:380px; margin:80px auto; }
.hidden { display:none !important; }
.ok { color:var(--green); }
.warn { color:var(--gold); }
.err { color:var(--red); }
.status-bar { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:10px; }
</style>
</head>
<body>
<div id="login" class="login">
  <div class="card" style="text-align:center;padding:24px;">
    <div class="badge" style="display:inline-block;margin-bottom:12px;">LIVE</div>
    <h1>UFFICIO IMPERO</h1>
    <p style="color:var(--muted);font-size:13px;margin:8px 0 16px;">CEO Ara · Control</p>
    <input type="password" id="pw" placeholder="Password" autofocus style="text-align:center;">
    <button class="btn btn-gold" onclick="doLogin()">Entra</button>
    <p id="err" class="err" style="display:none;margin-top:10px;">Password errata</p>
  </div>
</div>
<div id="app" class="hidden">
  <div class="top">
    <div>
      <div class="badge">LIVE WIRE</div>
      <h1 style="margin-top:4px;">Reactor</h1>
    </div>
    <div style="text-align:right;">
      <div class="metric-big" id="equity">—</div>
      <div class="metric-label">Equity</div>
    </div>
  </div>
  <div class="status-bar">
    <span id="gate-status" class="ok">Gate CHIUSO</span>
    <span id="kill-status" class="ok">Kill OK</span>
    <span>Ciclo 5m</span>
  </div>
  <div class="agents">
    <div class="agent"><span>🎯</span>Scout</div>
    <div class="agent"><span>📈</span>Trend</div>
    <div class="agent"><span>⚡</span>Momentum</div>
    <div class="agent"><span>🔄</span>MeanRev</div>
    <div class="agent"><span>🎯</span>Closer</div>
    <div class="agent"><span>⚖️</span>Prior</div>
  </div>
  <div class="grid">
    <div class="card">
      <div class="metric-big" id="cap">—</div>
      <div class="metric-label">Capitale €</div>
    </div>
    <div class="card">
      <div class="metric-big" id="dd">—</div>
      <div class="metric-label">Drawdown %</div>
    </div>
  </div>
  <div class="card">
    <button class="btn btn-dark" onclick="toggleGate()">Apri / Chiudi Gate</button>
    <button class="btn btn-red" onclick="doKill()">Kill Switch</button>
  </div>
  <div class="card">
    <p style="font-size:13px;color:var(--muted);margin-bottom:8px;">ORDINE MANUALE</p>
    <input id="sym" value="BZ=F" placeholder="Simbolo">
    <div class="grid">
      <select id="side"><option>LONG</option><option>SHORT</option></select>
      <input id="size" type="number" value="50" placeholder="Size €">
    </div>
    <input id="entry" type="number" step="0.0001" placeholder="Entry">
    <div class="grid">
      <input id="stop" type="number" step="0.0001" placeholder="Stop">
      <input id="tp" type="number" step="0.0001" placeholder="TP">
    </div>
    <button class="btn btn-gold" onclick="sendOrder()">Invia in coda</button>
    <p id="msg" style="text-align:center;margin-top:6px;font-size:13px;"></p>
  </div>
  <button class="btn btn-dark" onclick="logout()" style="margin-top:8px;">Esci</button>
</div>
<script>
const PASS = "impero2026";
let gateOpen = false;
function doLogin() {
  if (document.getElementById("pw").value === PASS) {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  } else document.getElementById("err").style.display = "block";
}
function logout() {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("pw").value = "";
}
function toggleGate() {
  gateOpen = !gateOpen;
  const el = document.getElementById("gate-status");
  el.textContent = gateOpen ? "Gate APERTO" : "Gate CHIUSO";
  el.className = gateOpen ? "warn" : "ok";
}
function doKill() {
  document.getElementById("kill-status").textContent = "Kill ATTIVO";
  document.getElementById("kill-status").className = "err";
}
function sendOrder() {
  const sym = document.getElementById("sym").value.trim();
  const entry = document.getElementById("entry").value;
  const msg = document.getElementById("msg");
  if (!sym || !entry) { msg.textContent = "Simbolo e Entry obbligatori"; msg.className = "err"; return; }
  msg.textContent = "Ordine in coda"; msg.className = "ok";
}
</script>
</body>
</html>
