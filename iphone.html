<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IMPERO">
<meta name="theme-color" content="#0a0c10">
<title>IMPERO</title>
<style>
:root { --bg:#0a0c10; --card:#12151c; --border:#1e2430; --blue:#3b82f6; --gold:#d4af37; --green:#22c55e; --red:#ef4444; --text:#e2e8f0; --muted:#64748b; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); min-height:100vh; }
.screen { max-width:420px; margin:0 auto; }
h1 { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
.sub { color:var(--muted); font-size:14px; margin:4px 0 20px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; }
.row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; }
.row .val { font-weight:600; font-size:18px; }
.agents { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
.agent { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 4px; text-align:center; }
.agent .ico { font-size:24px; }
.agent .nm { font-size:10px; color:var(--muted); margin-top:4px; font-weight:600; }
.agent .st { font-size:9px; color:var(--green); margin-top:2px; }
.btn { width:100%; padding:16px; border:none; border-radius:14px; font-size:16px; font-weight:600; margin:8px 0; }
.btn-blue { background:var(--blue); color:#fff; }
.btn-dark { background:#1e2430; color:var(--text); }
.btn-red { background:var(--red); color:#fff; }
input, select { width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); background:#0f1218; color:var(--text); margin:6px 0; font-size:16px; }
.login { padding-top:80px; text-align:center; }
.hidden { display:none !important; }
.ok { color:var(--green); }
.warn { color:var(--gold); }
.err { color:var(--red); }
.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.badge { background:#1e2430; color:var(--blue); border-radius:20px; padding:4px 10px; font-size:11px; font-weight:600; }
</style>
</head>
<body>
<div class="screen">
<div id="login" class="login">
  <div class="badge" style="display:inline-block;margin-bottom:16px;">LIVE</div>
  <h1>IMPERO</h1>
  <p class="sub">Trading Terminal · CEO Ara</p>
  <input type="password" id="pw" placeholder="Password" autofocus style="text-align:center;margin:20px 0;">
  <button class="btn btn-blue" onclick="login()">Entra</button>
  <p id="err" class="err" style="display:none;margin-top:12px;">Password errata</p>
</div>
<div id="app" class="hidden">
  <div class="top">
    <div>
      <div class="badge">THE TRADING FLOOR</div>
      <h1 style="font-size:24px;margin-top:4px;">IMPERO</h1>
    </div>
    <button class="btn btn-dark" style="width:auto;padding:8px 16px;margin:0;" onclick="logout()">Esci</button>
  </div>
  <div class="agents">
    <div class="agent"><div class="ico">🔴</div><div class="nm">SCANNER</div><div class="st">● RUNNING</div></div>
    <div class="agent"><div class="ico">🟢</div><div class="nm">ANALYST</div><div class="st">● RUNNING</div></div>
    <div class="agent"><div class="ico">🟡</div><div class="nm">RESEARCH</div><div class="st">● RUNNING</div></div>
    <div class="agent"><div class="ico">🔴</div><div class="nm">RISK</div><div class="st">● RUNNING</div></div>
    <div class="agent"><div class="ico">🟣</div><div class="nm">EXECUTOR</div><div class="st">● RUNNING</div></div>
    <div class="agent"><div class="ico">🔵</div><div class="nm">PORTFOLIO</div><div class="st">● RUNNING</div></div>
  </div>
  <div class="card">
    <div class="row"><span>Capitale</span><span class="val" id="cap">— €</span></div>
    <div class="row"><span>Equity</span><span class="val" id="eq">— €</span></div>
    <div class="row"><span>Drawdown</span><span class="val" id="dd">— %</span></div>
    <div class="row"><span>Gate</span><span class="val" id="gate">CHIUSO</span></div>
  </div>
  <button class="btn btn-dark" onclick="toggleGate()">Apri / Chiudi Gate</button>
  <button class="btn btn-red" onclick="doKill()">Kill Switch</button>
  <div class="card" style="margin-top:12px;">
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:1px;">ORDINE MANUALE</p>
    <input id="sym" value="BZ=F" placeholder="Simbolo">
    <select id="side"><option>LONG</option><option>SHORT</option></select>
    <input id="entry" type="number" step="0.0001" placeholder="Entry">
    <input id="stop" type="number" step="0.0001" placeholder="Stop">
    <input id="size" type="number" value="50" placeholder="Size €">
    <button class="btn btn-blue" onclick="send()">Invia in coda</button>
    <p id="msg" style="text-align:center;margin-top:8px;font-size:14px;"></p>
  </div>
</div>
</div>
<script>
const PASS = "impero2026";
let gateOpen = false;
function login() {
  if (document.getElementById("pw").value === PASS) {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
  } else document.getElementById("err").style.display = "block";
}
function logout() {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("pw").value = "";
}
function toggleGate() {
  gateOpen = !gateOpen;
  const el = document.getElementById("gate");
  el.textContent = gateOpen ? "APERTO" : "CHIUSO";
  el.style.color = gateOpen ? "#d4af37" : "#22c55e";
}
function doKill() {
  document.getElementById("gate").textContent = "KILL";
  document.getElementById("gate").style.color = "#ef4444";
}
function send() {
  const sym = document.getElementById("sym").value.trim();
  const entry = document.getElementById("entry").value;
  const msg = document.getElementById("msg");
  if (!sym || !entry) { msg.textContent = "Simbolo e Entry obbligatori"; msg.style.color = "#ef4444"; return; }
  msg.textContent = "Ordine in coda"; msg.style.color = "#22c55e";
}
</script>
</body>
</html>
