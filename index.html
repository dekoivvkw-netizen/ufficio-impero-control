<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0a08">
<title>UFFICIO IMPERO · Control</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0a08; color: #ece5d3; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; }
h1 { font-size: 22px; margin-bottom: 4px; }
.sub { color: #8d846c; font-size: 13px; margin-bottom: 20px; }
.card { background: #15130f; border: 1px solid #2e2918; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.metric { display: flex; justify-content: space-between; margin: 6px 0; }
.metric span:last-child { font-weight: 600; }
.btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; margin: 8px 0; }
.btn-primary { background: #c9a227; color: #0b0a08; }
.btn-secondary { background: #2e2918; color: #ece5d3; }
.btn-danger { background: #8b3a3a; color: #fff; }
input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2e2918; background: #15130f; color: #ece5d3; margin: 6px 0; font-size: 16px; }
.login { max-width: 360px; margin: 80px auto; }
.hidden { display: none; }
.status-ok { color: #6b9e6b; }
.status-warn { color: #c9a227; }
.status-err { color: #c96b6b; }
</style>
</head>
<body>
<div id="login" class="login">
  <div class="card">
    <h1>UFFICIO IMPERO</h1>
    <p class="sub">Accesso riservato</p>
    <input type="password" id="pw" placeholder="Password" autofocus>
    <button class="btn btn-primary" onclick="doLogin()">Entra</button>
    <p id="login-err" class="status-err" style="margin-top:10px;display:none;">Password errata</p>
  </div>
</div>
<div id="app" class="hidden">
  <h1>UFFICIO IMPERO · Control</h1>
  <p class="sub">CEO: Ara · v1.5</p>
  <div class="card">
    <div class="metric"><span>Capitale €</span><span id="cap">—</span></div>
    <div class="metric"><span>Equity €</span><span id="eq">—</span></div>
    <div class="metric"><span>Drawdown %</span><span id="dd">—</span></div>
  </div>
  <div class="card">
    <p>Gate: <span id="gate-status" class="status-ok">CHIUSO</span></p>
    <button class="btn btn-secondary" onclick="toggleGate()">Apri / Chiudi Gate</button>
  </div>
  <div class="card">
    <p>Kill Switch: <span id="kill-status" class="status-ok">OK</span></p>
    <button class="btn btn-danger" onclick="triggerKill()">Kill Switch</button>
  </div>
  <div class="card">
    <h3 style="margin-bottom:10px;">Ordine Manuale</h3>
    <input id="sym" placeholder="Simbolo (es. BZ=F)" value="BZ=F">
    <select id="side"><option>LONG</option><option>SHORT</option></select>
    <input id="entry" type="number" step="0.0001" placeholder="Entry">
    <input id="stop" type="number" step="0.0001" placeholder="Stop">
    <input id="tp" type="number" step="0.0001" placeholder="Take Profit">
    <input id="size" type="number" value="50" placeholder="Size €">
    <button class="btn btn-primary" onclick="sendOrder()">Metti in coda</button>
    <p id="order-msg" style="margin-top:8px;"></p>
  </div>
  <button class="btn btn-secondary" onclick="logout()">Esci</button>
</div>
<script>
const PASS = "impero2026";
let gateOpen = false;
function doLogin() {
  const v = document.getElementById("pw").value;
  if (v === PASS) {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    loadState();
  } else {
    document.getElementById("login-err").style.display = "block";
  }
}
function logout() {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("pw").value = "";
}
function toggleGate() {
  gateOpen = !gateOpen;
  const el = document.getElementById("gate-status");
  el.textContent = gateOpen ? "APERTO" : "CHIUSO";
  el.className = gateOpen ? "status-warn" : "status-ok";
}
function triggerKill() {
  document.getElementById("kill-status").textContent = "ATTIVO";
  document.getElementById("kill-status").className = "status-err";
  alert("Kill Switch attivato (locale).");
}
function sendOrder() {
  const sym = document.getElementById("sym").value;
  const entry = document.getElementById("entry").value;
  if (!sym || !entry) {
    document.getElementById("order-msg").textContent = "Simbolo e Entry obbligatori";
    return;
  }
  document.getElementById("order-msg").textContent = "Ordine registrato (locale).";
  document.getElementById("order-msg").className = "status-ok";
}
function loadState() {
  document.getElementById("cap").textContent = "—";
  document.getElementById("eq").textContent = "—";
  document.getElementById("dd").textContent = "—";
}
</script>
</body>
</html>
