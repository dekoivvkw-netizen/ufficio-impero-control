<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WOLFSTREET · Comando</title>
<style>
:root { --bg:#0a0c10; --card:#12151c; --line:#1e2430; --text:#e2e8f0; --muted:#64748b; --blue:#3b82f6; --green:#22c55e; --gold:#f2c94c; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,sans-serif; padding:14px; padding-bottom:80px; }
.header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.logo { width:32px; height:32px; background:var(--gold); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#0a0c10; }
h1 { font-size:18px; margin:0; }
.sub { color:var(--muted); font-size:11px; }
.agents { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; }
.agent { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; }
.agent .name { font-size:9px; font-weight:700; color:var(--gold); }
.agent .status { font-size:8px; color:var(--green); margin:2px 0; }
.agent .count { font-size:16px; font-weight:800; }
.tabs { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; }
.tab { background:var(--line); border:none; color:var(--text); padding:8px 14px; border-radius:8px; font-size:12px; white-space:nowrap; }
.tab.active { background:var(--blue); }
.page { display:none; }
.page.active { display:block; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; }
.row { display:flex; justify-content:space-between; align-items:center; }
.name { font-weight:700; font-size:14px; }
.meta { color:var(--muted); font-size:11px; }
.badge { font-size:10px; padding:3px 8px; border-radius:12px; font-weight:600; }
.badge.non { background:#1e2430; color:#a1a1aa; }
.badge.contattato { background:#1a3a5c; color:#60a5fa; }
.badge.risposto { background:#14532d; color:#4ade80; }
.badge.call { background:#713f12; color:#fbbf24; }
.badge.proposta { background:#1e1b4b; color:#a5b4fc; }
.btn { background:var(--blue); color:#fff; border:none; padding:7px 12px; border-radius:6px; font-size:12px; }
.btn.sec { background:transparent; border:1px solid var(--line); color:var(--text); margin-left:6px; }
.msg { background:#0a0c10; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; white-space:pre-wrap; margin:8px 0; line-height:1.4; }
.search { width:100%; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px; font-size:14px; margin-bottom:10px; }
.filters { display:flex; gap:6px; margin-bottom:10px; overflow-x:auto; }
.filter { background:var(--line); border:none; color:var(--text); padding:6px 10px; border-radius:6px; font-size:11px; }
.filter.active { background:var(--blue); }
.note { width:100%; background:#0a0c10; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px; font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">W</div>
  <div>
    <h1>WOLFSTREET · COMANDO</h1>
    <div class="sub">Torino · 50 lead</div>
  </div>
</div>
<div class="agents">
  <div class="agent"><div class="name">SCOUT</div><div class="status">● OPERATIVO</div><div class="count" id="a-scout">50</div></div>
  <div class="agent"><div class="name">FILTER</div><div class="status">● OPERATIVO</div><div class="count" id="a-filter">0</div></div>
  <div class="agent"><div class="name">OUTREACH</div><div class="status">● OPERATIVO</div><div class="count" id="a-out">0</div></div>
  <div class="agent"><div class="name">FOLLOW-UP</div><div class="status">● OPERATIVO</div><div class="count" id="a-fol">0</div></div>
</div>
<div class="tabs">
  <button class="tab active" onclick="show('lead')">Lead</button>
  <button class="tab" onclick="show('msg')">Messaggi</button>
  <button class="tab" onclick="show('prop')">Proposta</button>
  <button class="tab" onclick="show('oggi')">Oggi</button>
  <button class="tab" onclick="exportCSV()">Export</button>
</div>
<div id="lead" class="page active">
  <input class="search" id="search" placeholder="Cerca lead..." oninput="renderLead()">
  <div class="filters" id="filters"></div>
  <div id="leadList"></div>
</div>
<div id="msg" class="page"></div>
<div id="prop" class="page"></div>
<div id="oggi" class="page"></div>
<script>
const leads = [{"id": 1, "nome": "Rimodella Torino", "settore": "Estetica", "wa": "+393494746001", "stato": "non", "note": ""}, {"id": 2, "nome": "Elylashes di Elisa Cioce", "settore": "Estetica", "wa": "+393473276358", "stato": "non", "note": ""}, {"id": 3, "nome": "VERA Trucco Permanente", "settore": "Estetica", "wa": "+393336478884", "stato": "non", "note": ""}, {"id": 4, "nome": "Il Piede Centro Estetico", "settore": "Estetica", "wa": "+393391637555", "stato": "non", "note": ""}, {"id": 5, "nome": "Que Bolà", "settore": "Ristorante", "wa": "+393751187171", "stato": "non", "note": ""}];
let filter = "Tutti";
const settori = ["Tutti","Estetica","Palestra","Ristorante","Studio"];
const messaggi = {
  Estetica: "Ciao, sono di WOLFSTREET.\n\nHo visto [NOME]. Hai WhatsApp ma non una gestione automatica delle richieste.\n\nPosso configurare in 48h un sistema che:\n- risponde subito\n- fa follow-up a chi non prenota\n- ti mostra quante richieste arrivano\n\n30 giorni di prova, €97 il primo mese. Se non funziona, smetti.\n\nTi interessa una chiamata di 15 minuti?",
  Palestra: "Ciao, sono di WOLFSTREET.\n\nMolti personal trainer perdono clienti perché non fanno follow-up dopo la prova.\n\nPosso impostare un sistema che:\n- ricontatta chi ha fatto la prova e non si è iscritto\n- ricorda le scadenze\n- traccia chi ha risposto\n\n30 giorni, €97. Poi decidi.\n\nVuoi una chiamata di 15 minuti?",
  Ristorante: "Ciao, sono di WOLFSTREET.\n\nHo notato [NOME]. Ricevi richieste su WhatsApp ma non hai un sistema di follow-up.\n\nPosso configurare risposte automatiche per disponibilità e conferme.\n\nProva 30 giorni a €97. Se non serve, smetti.\n\nTi va una chiamata di 10 minuti?",
  Studio: "Ciao, sono di WOLFSTREET.\n\nHo visto [NOME]. Molti studi professionali perdono tempo su richieste ripetitive e follow-up.\n\nPosso configurare un sistema che:\n- risponde alle richieste comuni\n- fa follow-up automatico\n- traccia le attività\n\n30 giorni di prova, €97. Se non serve, smetti.\n\nTi interessa una chiamata di 15 minuti?"
};
function show(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(id).classList.add('active');
  if (id === 'lead') renderLead();
  if (id === 'msg') renderMsg();
  if (id === 'prop') renderProp();
  if (id === 'oggi') renderOggi();
}
function statoLabel(s) {
  return {non:"Non contattato", contattato:"Contattato", risposto:"Risposto", call:"Call fissata", proposta:"Proposta"}[s] || s;
}
function renderFilters() {
  document.getElementById('filters').innerHTML = settori.map(s => 
    `<button class="filter ${s===filter?'active':''}" onclick="setFilter('${s}')">${s}</button>`
  ).join('');
}
function setFilter(s) { filter = s; renderLead(); }
function renderLead() {
  renderFilters();
  const q = document.getElementById('search').value.toLowerCase();
  const list = leads.filter(l => (filter==="Tutti" || l.settore===filter) && l.nome.toLowerCase().includes(q));
  document.getElementById('leadList').innerHTML = list.map(l => `
    <div class="card">
      <div class="row">
        <div>
          <div class="name">${l.nome}</div>
          <div class="meta">${l.settore} · ${l.wa}</div>
        </div>
        <span class="badge ${l.stato}">${statoLabel(l.stato)}</span>
      </div>
      <div style="margin-top:8px;">
        <button class="btn" onclick="setStato(${l.id},'contattato')">Contattato</button>
        <button class="btn sec" onclick="setStato(${l.id},'risposto')">Risposto</button>
        <button class="btn sec" onclick="setStato(${l.id},'call')">Call</button>
        <button class="btn sec" onclick="setStato(${l.id},'proposta')">Proposta</button>
      </div>
      <input class="note" placeholder="Note..." value="${l.note||''}" onchange="setNote(${l.id}, this.value)">
    </div>
  `).join('');
  updateAgents();
}
function setStato(id, s) {
  const l = leads.find(x => x.id === id);
  if (l) l.stato = s;
  save();
  renderLead();
}
function setNote(id, n) {
  const l = leads.find(x => x.id === id);
  if (l) l.note = n;
  save();
}
function renderMsg() {
  document.getElementById('msg').innerHTML = leads.filter(l => l.wa !== "—").slice(0,8).map(l => {
    const tpl = messaggi[l.settore] || messaggi.Estetica;
    const text = tpl.replace(/\[NOME\]/g, l.nome);
    return `<div class="card">
      <div class="name">${l.nome}</div>
      <div class="meta">${l.settore} · ${l.wa}</div>
      <div class="msg">${text}</div>
      <button class="btn" onclick="navigator.clipboard.writeText(this.previousElementSibling.innerText); this.innerText='Copiato'; setTimeout(()=>this.innerText='Copia messaggio',1200)">Copia messaggio</button>
    </div>`;
  }).join('');
}
function renderProp() {
  const first = leads.find(l => l.stato === 'call' || l.stato === 'proposta') || leads[0];
  const text = `Oggetto: Proposta pilota 30 giorni — ${first.nome}\n\nCiao,\n\ncome da chiamata, ecco la proposta per ${first.nome}:\n\nCosa faccio\n- Configuro risposte automatiche WhatsApp\n- Imposto follow-up a 24h e 7 giorni\n- Ti do una dashboard con le richieste\n- Report ogni venerdì\n\nKPI\n- Tempo prima risposta\n- % follow-up eseguiti\n- Prenotazioni/iscrizioni generate\n\nPrezzo\n- Setup: €297\n- Primo mese: €97\n- Dopo: €197/mese o stop\n\nDurata: 30 giorni dal kickoff.\n\nSe ok, rispondi con \"confermo\" e ti mando i passi per l'accesso WhatsApp.`;
  document.getElementById('prop').innerHTML = `<div class="card">
    <div class="name">Proposta per ${first.nome}</div>
    <div class="msg">${text}</div>
    <button class="btn" onclick="navigator.clipboard.writeText(this.previousElementSibling.innerText); this.innerText='Copiato'; setTimeout(()=>this.innerText='Copia proposta',1200)">Copia proposta</button>
  </div>`;
}
function renderOggi() {
  const todo = leads.filter(l => l.stato === 'non' && l.wa !== "—").slice(0,5);
  document.getElementById('oggi').innerHTML = `<div class="card"><div class="name">Da contattare oggi</div>
    ${todo.map(l => `<div class="row" style="padding:8px 0;border-bottom:1px solid #1e2430"><span>${l.nome}</span><span class="meta">${l.wa}</span></div>`).join('')}
  </div>
  <div class="card"><div class="name">Target</div><div class="meta">Contattare 5 lead · Ottenere 1 risposta</div></div>`;
}
function updateAgents() {
  document.getElementById('a-out').textContent = leads.filter(l => l.stato !== 'non').length;
  document.getElementById('a-fol').textContent = leads.filter(l => ['risposto','call','proposta'].includes(l.stato)).length;
  document.getElementById('a-filter').textContent = leads.filter(l => l.stato !== 'non').length;
}
function exportCSV() {
  const csv = "nome,settore,whatsapp,stato,note\n" + leads.map(l => `"${l.nome}","${l.settore}","${l.wa}","${l.stato}","${l.note||''}"`).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "wolfstreet_leads.csv";
  a.click();
}
function save() { localStorage.setItem('wolf_v5', JSON.stringify(leads)); }
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem('wolf_v5') || '[]');
    saved.forEach(s => {
      const l = leads.find(x => x.id === s.id);
      if (l) { l.stato = s.stato; l.note = s.note || ''; }
    });
  } catch(e) {}
}
load();
renderLead();
</script>
</body>
</html>
